<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Messages</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #000000;
            color: #ffffff;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* Top Bar - Only Clear Button on Top Right */
        .top-bar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            display: flex;
            justify-content: flex-end;
            padding: 16px 24px;
            z-index: 30;
            pointer-events: none;
        }

        .clear-btn {
            pointer-events: auto;
            background: #111111;
            color: #ffffff;
            border: 1px solid #333333;
            padding: 7px 16px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .clear-btn:hover {
            background: #222222;
            border-color: #666666;
        }

        /* Full page messages area */
        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 70px 24px 100px 24px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-width: 900px;
            width: 100%;
            margin: 0 auto;
        }

        /* Message item */
        .msg-row {
            display: flex;
            width: 100%;
            animation: fadeIn 0.15s ease-out;
        }

        .msg-row.mine {
            justify-content: flex-end;
        }

        .msg-row.other {
            justify-content: flex-start;
        }

        .msg-bubble {
            max-width: 75%;
            background: #111111;
            border: 1px solid #262626;
            border-radius: 12px;
            padding: 12px 14px;
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .msg-row.mine .msg-bubble {
            background: #171717;
            border-color: #383838;
        }

        .msg-content {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #ffffff;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .msg-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 4px;
        }

        .msg-time {
            font-size: 0.7rem;
            color: #737373;
        }

        /* Copy Button */
        .copy-btn {
            background: #1c1c1c;
            border: 1px solid #333333;
            color: #d4d4d4;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.72rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 4px;
            transition: all 0.15s ease;
        }

        .copy-btn:hover {
            background: #2a2a2a;
            color: #ffffff;
            border-color: #555555;
        }

        .copy-btn.copied {
            background: #ffffff;
            color: #000000;
            border-color: #ffffff;
        }

        /* Bottom Fixed Input Box */
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            padding: 16px 24px;
            background: linear-gradient(180deg, rgba(0,0,0,0) 0%, #000000 30%);
            display: flex;
            justify-content: center;
            z-index: 30;
        }

        .input-form {
            width: 100%;
            max-width: 900px;
            display: flex;
            align-items: flex-end;
            gap: 10px;
            background: #0d0d0d;
            border: 1px solid #2b2b2b;
            padding: 8px 10px;
            border-radius: 12px;
        }

        .input-form:focus-within {
            border-color: #666666;
        }

        .input-form textarea {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: #ffffff;
            font-size: 0.95rem;
            padding: 6px 10px;
            resize: none;
            max-height: 160px;
            overflow-y: auto;
            line-height: 1.4;
            font-family: inherit;
        }

        .input-form textarea::placeholder {
            color: #525252;
        }

        .input-form button {
            background: #ffffff;
            color: #000000;
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 0.88rem;
            cursor: pointer;
            transition: all 0.15s ease;
            height: 36px;
            flex-shrink: 0;
            white-space: nowrap;
            display: inline-flex;
            align-items: center;
            justify-content: center;
        }

        .input-form button:hover {
            opacity: 0.85;
        }

        .input-form button.copied-anim {
            background: #22c55e;
            color: #ffffff;
        }

        @media (max-width: 480px) {
            .input-form {
                padding: 6px 8px;
                gap: 6px;
            }
            .input-form button {
                padding: 8px 12px;
                font-size: 0.8rem;
            }
            .bottom-bar {
                padding: 10px 12px;
            }
            .messages-container {
                padding: 60px 14px 85px 14px;
            }
        }

        /* Confirmation Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
            animation: fadeIn 0.15s ease-out;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal-box {
            background: #111111;
            border: 1px solid #333333;
            border-radius: 14px;
            padding: 24px;
            width: 90%;
            max-width: 360px;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .modal-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #ffffff;
        }

        .modal-desc {
            font-size: 0.85rem;
            color: #888888;
            line-height: 1.4;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }

        .modal-btn {
            flex: 1;
            padding: 9px 14px;
            border-radius: 8px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.15s ease;
        }

        .modal-btn.cancel {
            background: transparent;
            color: #cccccc;
            border: 1px solid #333333;
        }

        .modal-btn.cancel:hover {
            background: #1e1e1e;
            color: #ffffff;
        }

        .modal-btn.confirm {
            background: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
        }

        .modal-btn.confirm:hover {
            opacity: 0.85;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97); }
            to { opacity: 1; transform: scale(1); }
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #262626;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #404040;
        }
    </style>
</head>
<body>

    <!-- Top Right Corner Clear Button -->
    <div class="top-bar">
        <button class="clear-btn" id="open-clear-modal">Clear</button>
    </div>

    <!-- Full Screen Messages Container -->
    <div class="messages-container" id="messages-container"></div>

    <!-- Fixed Bottom Input Box -->
    <div class="bottom-bar">
        <form class="input-form" id="chat-form">
            <textarea 
                id="message-input" 
                rows="1" 
                placeholder="Message..." 
                autocomplete="off"
            ></textarea>
            <button type="submit" id="send-btn">Copy & Send</button>
        </form>
    </div>

    <!-- Custom Confirmation Modal -->
    <div class="modal-overlay" id="confirm-modal">
        <div class="modal-box">
            <div class="modal-title">Clear all messages?</div>
            <div class="modal-desc">This action will delete all messages and remove them from everyone's screen.</div>
            <div class="modal-actions">
                <button class="modal-btn cancel" id="cancel-clear">Cancel</button>
                <button class="modal-btn confirm" id="confirm-clear">Clear</button>
            </div>
        </div>
    </div>

    <script>
        // Unique user identity
        let myId = sessionStorage.getItem('chat_user_id');
        if (!myId) {
            myId = 'user_' + Math.random().toString(36).substring(2, 9);
            sessionStorage.setItem('chat_user_id', myId);
        }

        const messagesContainer = document.getElementById('messages-container');
        const chatForm = document.getElementById('chat-form');
        const messageInput = document.getElementById('message-input');
        const sendBtn = document.getElementById('send-btn');
        const openClearModalBtn = document.getElementById('open-clear-modal');
        const confirmModal = document.getElementById('confirm-modal');
        const cancelClearBtn = document.getElementById('cancel-clear');
        const confirmClearBtn = document.getElementById('confirm-clear');

        // Robust Clipboard Copy Function for Mobile & PC
        function copyTextToClipboard(text) {
            if (!text) return Promise.resolve();

            if (navigator.clipboard && window.isSecureContext) {
                return navigator.clipboard.writeText(text).catch(() => fallbackCopyText(text));
            } else if (navigator.clipboard) {
                return navigator.clipboard.writeText(text).catch(() => fallbackCopyText(text));
            } else {
                return fallbackCopyText(text);
            }
        }

        function fallbackCopyText(text) {
            return new Promise((resolve, reject) => {
                const textArea = document.createElement("textarea");
                textArea.value = text;
                textArea.style.top = "0";
                textArea.style.left = "0";
                textArea.style.position = "fixed";
                textArea.style.opacity = "0";
                textArea.setAttribute("readonly", "");
                document.body.appendChild(textArea);
                textArea.focus();
                textArea.select();
                textArea.setSelectionRange(0, 99999); // Essential for mobile iOS/Android
                try {
                    const successful = document.execCommand('copy');
                    document.body.removeChild(textArea);
                    if (successful) resolve();
                    else reject(new Error('execCommand copy failed'));
                } catch (err) {
                    document.body.removeChild(textArea);
                    reject(err);
                }
            });
        }

        const STORAGE_KEY = 'live_chat_messages';
        let messages = [];

        // 1. Broadcast Channel (Instant sync across tabs/windows without server)
        let broadcastChannel = null;
        if ('BroadcastChannel' in window) {
            broadcastChannel = new BroadcastChannel('live_socket_chat');
            broadcastChannel.onmessage = (event) => {
                if (event.data?.type === 'NEW_MESSAGE') {
                    handleIncomingMessage(event.data.payload);
                } else if (event.data?.type === 'CLEAR') {
                    messages = [];
                    renderMessages();
                }
            };
        }

        // 2. WebSocket Connection (Sync across devices/internet)
        let ws = null;
        function connectWebSocket() {
            try {
                const wsUrl = window.location.protocol === 'file:' 
                    ? 'ws://localhost:3000' 
                    : (window.location.protocol === 'https:' ? 'wss://' : 'ws://') + window.location.host;

                ws = new WebSocket(wsUrl);

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'INIT_HISTORY') {
                            messages = data.messages || [];
                            localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
                            renderMessages();
                        } else if (data.type === 'NEW_MESSAGE') {
                            handleIncomingMessage(data.payload);
                        } else if (data.type === 'CLEAR') {
                            messages = [];
                            localStorage.removeItem(STORAGE_KEY);
                            renderMessages();
                        }
                    } catch (e) {
                        console.error(e);
                    }
                };

                ws.onclose = () => {
                    setTimeout(connectWebSocket, 3000);
                };
            } catch (err) {
                console.warn('WS fallback active');
            }
        }

        // History Management
        function loadHistory() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    messages = JSON.parse(saved);
                } catch (e) {
                    messages = [];
                }
            }
            renderMessages();
        }

        window.addEventListener('storage', (e) => {
            if (e.key === STORAGE_KEY) loadHistory();
        });

        function handleIncomingMessage(msg) {
            if (!messages.some(m => m.id === msg.id)) {
                messages.push(msg);
                localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
                appendMessageToUI(msg);
            }
        }

        function appendMessageToUI(msg) {
            const isMine = msg.senderId === myId;
            const row = document.createElement('div');
            row.className = `msg-row ${isMine ? 'mine' : 'other'}`;

            const bubble = document.createElement('div');
            bubble.className = 'msg-bubble';

            // Raw text preservation: textContent keeps all symbols, spaces, angle brackets, emojis exact
            const contentEl = document.createElement('div');
            contentEl.className = 'msg-content';
            contentEl.textContent = msg.text;

            const footerEl = document.createElement('div');
            footerEl.className = 'msg-footer';

            const timeStr = new Date(msg.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            const timeEl = document.createElement('span');
            timeEl.className = 'msg-time';
            timeEl.textContent = timeStr;

            const copyBtn = document.createElement('button');
            copyBtn.className = 'copy-btn';
            copyBtn.type = 'button';
            copyBtn.textContent = 'Copy';
            copyBtn.addEventListener('click', () => {
                copyTextToClipboard(msg.text).then(() => {
                    copyBtn.innerText = 'Copied!';
                    copyBtn.classList.add('copied');
                    setTimeout(() => {
                        copyBtn.innerText = 'Copy';
                        copyBtn.classList.remove('copied');
                    }, 1500);
                }).catch(() => {});
            });

            footerEl.appendChild(timeEl);
            footerEl.appendChild(copyBtn);

            bubble.appendChild(contentEl);
            bubble.appendChild(footerEl);

            row.appendChild(bubble);
            messagesContainer.appendChild(row);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function renderMessages() {
            messagesContainer.innerHTML = '';
            messages.forEach(msg => appendMessageToUI(msg));
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Auto-expand textarea
        messageInput.addEventListener('input', () => {
            messageInput.style.height = 'auto';
            messageInput.style.height = Math.min(messageInput.scrollHeight, 160) + 'px';
        });

        // Send on Enter (Shift + Enter for new line)
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                chatForm.dispatchEvent(new Event('submit'));
            }
        });

        // Send Message: EXACT message, NO TRIM, NO CROP + Auto Copy & Send
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value;
            if (text === '') return; // Exact check: koi trim ya crop nahi

            // 1. Auto Copy text to clipboard immediately on mobile & PC
            copyTextToClipboard(text).then(() => {
                if (sendBtn) {
                    const originalText = sendBtn.textContent;
                    sendBtn.textContent = 'Copied!';
                    sendBtn.classList.add('copied-anim');
                    setTimeout(() => {
                        sendBtn.textContent = originalText;
                        sendBtn.classList.remove('copied-anim');
                    }, 1200);
                }
            }).catch(() => {});

            const newMsg = {
                id: 'msg_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6),
                senderId: myId,
                text: text, // Exact raw string with spaces, symbols, newlines
                timestamp: Date.now()
            };

            messages.push(newMsg);
            localStorage.setItem(STORAGE_KEY, JSON.stringify(messages));
            appendMessageToUI(newMsg);

            messageInput.value = '';
            messageInput.style.height = 'auto';

            // Broadcast locally to other tabs
            if (broadcastChannel) {
                broadcastChannel.postMessage({ type: 'NEW_MESSAGE', payload: newMsg });
            }

            // Broadcast via WebSocket
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'NEW_MESSAGE', payload: newMsg }));
            }
        });

        // Confirmation Modal for Clear
        openClearModalBtn.addEventListener('click', () => {
            confirmModal.classList.add('active');
        });

        cancelClearBtn.addEventListener('click', () => {
            confirmModal.classList.remove('active');
        });

        confirmModal.addEventListener('click', (e) => {
            if (e.target === confirmModal) {
                confirmModal.classList.remove('active');
            }
        });

        confirmClearBtn.addEventListener('click', () => {
            confirmModal.classList.remove('active');
            messages = [];
            localStorage.removeItem(STORAGE_KEY);
            renderMessages();

            if (broadcastChannel) {
                broadcastChannel.postMessage({ type: 'CLEAR' });
            }

            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'CLEAR' }));
            }
        });

        // Initialize
        loadHistory();
        connectWebSocket();
    </script>
</body>
</html>
